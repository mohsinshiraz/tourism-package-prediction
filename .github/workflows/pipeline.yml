name: Tourism Package MLOps Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'project_tourismpred/model_building/*.joblib'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "pandas<3.0" scikit-learn xgboost joblib

      - name: Register Dataset
        run: python project_tourismpred/model_building/data_register.py

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "pandas<3.0" scikit-learn xgboost joblib

      - name: Prepare and Split Data
        run: python project_tourismpred/model_building/prep.py

      - name: Upload processed datasets
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: |
            project_tourismpred/data/Xtrain.csv
            project_tourismpred/data/Xtest.csv
            project_tourismpred/data/ytrain.csv
            project_tourismpred/data/ytest.csv

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download processed datasets
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: project_tourismpred/data/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "pandas<3.0" scikit-learn xgboost joblib

      - name: Train and Evaluate Model
        run: python project_tourismpred/model_building/train.py

      - name: Push Trained Model to Main Branch
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add project_tourismpred/model_building/best_tourism_package_model_v1.joblib
          git diff --staged --quiet || git commit -m "chore: update trained model artifact [skip ci]"
          git push origin main

  deploy:
    needs: model-training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main branch with updated model
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy & Verify Streamlit Application
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: python project_tourismpred/deployment/hosting.py
